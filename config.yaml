project:
  name: clip-genomics-encoder
  task: masked-gene-set-retrieval

data:
  raw: data/raw/metadata_genomics.parquet
  schema:
    patient_id_column: patient_id
    gene_symbol_column: gene_symbol_list
    gene_index_column: gene_symbol_index_list

training:
  model_name: deep_sets
  objective: masked_gene_BCE

  learning_rate: 1e-3
  weight_decay: 1e-4
  batch_size: 32
  epochs: 30
  recall_at_ks: [10, 50, 150]
  mask_probability: 0.15
  max_genes: 1000

  embedding_dim: 256
  hidden_dim: 1024
  dropout: 0.1
  pos_weight_max: 100.0

splits:
  train: 0.80
  val: 0.10
  test: 0.10

runtime:
  seed: 42
  device: auto

outputs:
  runs_dir: outputs/runs
  results_filename_template: "{model}_results.json"
