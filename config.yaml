project:
  name: clip-genomics-encoder
  task: masked-gene-set-retrieval

data:
  raw:
    metadata_parquet: data/raw/metadata_genomics.parquet
  schema:
    patient_id_column: patient_id
    gene_symbol_column: gene_symbol_list
    gene_index_column: gene_symbol_index_list

model:
  output_dim: 512
  deep_sets:
    pooling: sum
    training_overrides:
      embedding_dim: 128
      hidden_dim: 512
      dropout: 0.1
      learning_rate: 1e-3
      weight_decay: 1e-4
      max_genes: 4096

training:
  config_name: default
  objective: masked_gene_binary_cross_entropy_with_logits
  batch_size: 32
  epochs: 50
  learning_rate: 1e-3
  weight_decay: 1e-4
  recall_at_k: 10
  mask_probability: 0.15
  max_genes: 4096
  embedding_dim: 128
  hidden_dim: 512
  dropout: 0.1
  pos_weight_max: 100.0

splits:
  strategy: random_patient_level
  unit: patient
  patient_key: patient_id
  train_fraction: 0.70
  val_fraction: 0.15
  test_fraction: 0.15

runtime:
  seed: 42
  device: auto

outputs:
  runs_dir: outputs/runs
  checkpoints_dir: outputs/checkpoints
  results_filename_template: "{model}_results.json"
  checkpoint_filename_template: "{model}_{config_name}_encoder.pt"
